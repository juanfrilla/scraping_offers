name: Build Go Scraper & Validate Python

permissions:
  contents: write

on:
  push:
    branches: ["main"]

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: scraping-offers
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # -------------------------
      # GO BUILD
      # -------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Go dependencies
        run: go mod tidy

      # -------------------------
      # GO TESTS
      # -------------------------
      - name: Run Go tests
        run: go test -v ./go/...

      - name: Build Go scraper for Linux
        run: |
          GOOS=linux GOARCH=amd64 go build -o ./go/bin/scraper_go ./go/main.go
          chmod +x ./go/bin/scraper_go

      # -------------------------
      # PYTHON VALIDATION
      # -------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Streamlit app imports
        run: python -m py_compile main.py

      # -------------------------
      # SCRAPING
      # -------------------------
      - name: Run Go scraper
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: ./go
        run: ./bin/scraper_go

      # -------------------------
      # COMMIT RESULTS
      # -------------------------
      - name: Commit updated files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -f go/bin/scraper_go
          git add -f data/last_scraped.json
          git add -f data/jobs.db

          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "CI: update scraper and job offers [skip ci]"
            git push origin HEAD:main
          fi
